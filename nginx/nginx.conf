# Reverse proxy + load balancer in front of the calculator-api replicas.
# Installed as /etc/nginx/conf.d/default.conf

# Docker's embedded DNS server. Re-resolve every 5s so that after a
# re-deploy (new containers -> new IPs) Nginx picks up the new replicas.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream calculator_backend {
    zone calculator_backend 64k;
    # "calculator-api" is the Compose service name; Docker DNS returns one
    # IP per replica and Nginx round-robins between them.
    server calculator-api:8080 resolve max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Do not advertise the Nginx version
    server_tokens off;

    # Health of the proxy itself (used by the nginx container health check)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        proxy_pass http://calculator_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If one replica is down (e.g. while being replaced), retry the other
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;

        # Shows which replica answered - handy to demonstrate load balancing
        add_header X-Served-By $upstream_addr always;
    }
}

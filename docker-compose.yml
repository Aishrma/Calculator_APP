# Full deployment stack:  client -> nginx (port ${HTTP_PORT}) -> 2 x calculator-api
#
#   docker compose up -d            # start (pulls the image from Docker Hub)
#   docker compose up -d --build    # start, building images locally instead
#   docker compose ps               # status + health
#   docker compose down             # stop and remove
#
# Variables (set by Jenkins, or put them in a local .env file):
#   DOCKERHUB_USER  Docker Hub namespace of the image
#   IMAGE_TAG       image tag to deploy (Jenkins uses the build number)
#   HTTP_PORT       host port for the proxy (default 8081; Jenkins uses 8080)

# Fixed project name -> every run (manual or Jenkins, from any folder)
# manages the SAME containers, which keeps redeploys idempotent.
name: calculator

services:
  calculator-api:
    image: ${DOCKERHUB_USER:-aishrma}/calculator-api:${IMAGE_TAG:-latest}
    build:
      context: .
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    environment:
      SERVER_PORT: "8080"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
      INFO_APP_ENVIRONMENT: "docker-compose"
      INFO_APP_IMAGE_TAG: "${IMAGE_TAG:-latest}"
      TZ: "Asia/Kolkata"
    expose:
      - "8080"            # reachable only inside the network, via nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - calculator-net

  nginx:
    image: calculator-nginx:latest
    build:
      context: ./nginx
    ports:
      - "${HTTP_PORT:-8081}:80"
    depends_on:
      calculator-api:
        condition: service_healthy   # start proxy only once the API is UP
    environment:
      TZ: "Asia/Kolkata"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - calculator-net

networks:
  calculator-net:
    name: calculator-net
    driver: bridge

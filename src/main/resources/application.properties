spring.application.name=calculator-api

# Port can be overridden with the SERVER_PORT environment variable (see docker-compose.yml)
server.port=8080

# Write BigDecimal as 10 instead of 1E+1
spring.jackson.generator.write-bigdecimal-as-plain=true

# Actuator: expose only health + info over HTTP
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.version=@project.version@

# Graceful shutdown so `docker compose up -d` re-deploys don't cut requests mid-flight
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
